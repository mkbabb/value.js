# deploy-pages.yml — color.babb.dev's deploy-of-record (the constellation
# CF-Pages spine; N.W4.F / Ask 5 / DEC-5).
#
# color.babb.dev is a Cloudflare Pages project (`color` → color-enw.pages.dev),
# deployed via wrangler — NOT GitHub Pages. The `npm run gh-pages` script name is
# a historical artefact (it builds the demo SPA to dist/gh-pages); the SITE ships
# to Cloudflare Pages, which is where the DNS for color.babb.dev points. The
# matching api origin (api.color.babb.dev) ships separately via the babb.dev
# spine webhook (scripts/deploy/deploy.sh api) — this workflow is the DEMO half only.
#
# GREEN-CI-GATED (the constellation verified-deploy-of-record idiom): it triggers
# on the `CI` workflow *completing* and deploys ONLY when that same-SHA run is
# GREEN, on a master push. A red CI → the deploy job's `if` is false → the SPA
# does NOT ship. Every green-CI master push DEPLOYS — no path filter (a master
# push should always re-ship the live site). `workflow_dispatch` allows a manual
# re-ship.
#
# SECRET DISCIPLINE: CLOUDFLARE_API_TOKEN (Pages:Edit + Read) + CLOUDFLARE_ACCOUNT_ID
# are GH Actions repo secrets, consumed via ${{ secrets.* }}, never inlined/echoed.
#
# FIRST-RUN NOTE: the `color` CF Pages project ALREADY EXISTS (verified via
# `wrangler pages project list`: color → color-enw.pages.dev / color.babb.dev),
# so no first-run project creation is needed — wrangler deploys into it. (Were it
# absent, `wrangler pages deploy` creates the named project on first push.)
name: deploy-pages

on:
    workflow_run:
        # Must match the `name:` of .github/workflows/ci.yml exactly.
        workflows: ["CI"]
        types: [completed]
    workflow_dispatch: {}

concurrency:
    group: deploy-pages-${{ github.event.workflow_run.head_sha || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    deploy:
        name: build demo + ship → Cloudflare Pages
        # Deploy on a manual dispatch, OR whenever the `CI` workflow finishes
        # GREEN on a master PUSH. The triple gate (conclusion == success AND
        # head_branch == master AND event == push) is the idiomatic
        # verified-deploy shape: a red CI, a non-master branch, or a non-push
        # trigger (e.g. a PR run) never ships the live site.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'master' &&
             github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # NESTED-WORKSPACE LAYOUT (R.W7 X3 first-wire finding): the repo nests at
        # ./value.js because actions/checkout refuses paths outside
        # $GITHUB_WORKSPACE, and this job once checked producer siblings out beside
        # it. Those sibling checkouts are GONE (X-W1 · CC-034 · G-15, below) and
        # nothing is nested beside the repo any more. The layout itself is kept
        # byte-for-byte: it is the shape every recorded successful deploy ran under,
        # it is orthogonal to the provenance defect cured below, and unwinding it is
        # a structural change no local run can verify. Recorded as a residual for
        # the X-W11 release close — never as a live dependency.
        defaults:
            run:
                working-directory: value.js
        steps:
            - uses: actions/checkout@v5
              with:
                  # Build the EXACT SHA that CI proved green (not the branch tip,
                  # which could have advanced). On manual dispatch this is unset →
                  # falls back to the dispatched ref.
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  fetch-depth: 0
                  path: value.js
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: value.js/package-lock.json
            # PRODUCER RESOLUTION IS THE REGISTRY'S (X-W1 · CC-034 · DR-22 · G-15).
            # This job used to check mkbabb/glass-ui out at its `tranche/BG` branch
            # and build that dist before `npm ci`, under a `file:../glass-ui` premise
            # that has not been true since W44 adopted glass 7.0.0 whole:
            # package.json declares `@mkbabb/glass-ui: ^7.0.0` and
            # package-lock.json pins the registry tarball, so `npm ci` has been
            # installing registry bytes while the job spent minutes building a
            # branch tree (BG head = 5.0.0) that nothing consumed — the deploy
            # claimed a provenance it did not have, and the named un-pin waypoint
            # (the "5.0.0 master landing") was skipped outright: glass went
            # 4.2.0 → 7.0.0. The keyframes.js checkout carried the identical dead
            # premise (`^6.0.0`, registry-pinned) and goes with it. `npm ci` below
            # IS the install the declaration already implies; ci.yml — the workflow
            # whose green gates this one — has always had exactly this shape.
            - name: npm ci
              run: npm ci
            # G-15's proof, structural rather than one-time: the producer the
            # deployed bundle links MUST come from the registry, and the subpaths
            # the demo imports MUST be in that producer's exports map. `./blob`
            # (5 sites, incl. demo/color-picker/composables/boot/useAtmosphere.ts)
            # and `./chip` (EasingSpecimenStrip.vue) are named because they are the
            # pair the tranche/BG head did not export — a build resolved through
            # that tree dies at the first of them. This step reds the deploy BEFORE
            # the build if a producer bump ever drops either subpath, or if
            # resolution ever silently reverts to a linked sibling tree.
            - name: "Assert producer provenance (registry) + the demo's subpaths resolve"
              run: |
                  set -euo pipefail
                  node --input-type=module <<'NODE'
                  import { readFileSync } from "node:fs";
                  const hidden = JSON.parse(readFileSync("node_modules/.package-lock.json", "utf8"));
                  const entry = hidden.packages["node_modules/@mkbabb/glass-ui"];
                  if (!entry) throw new Error("@mkbabb/glass-ui is not installed");
                  if (entry.link) throw new Error(`@mkbabb/glass-ui is a link to ${entry.resolved} — the deploy must build against the registry`);
                  if (!/^https:\/\/registry\.npmjs\.org\//.test(entry.resolved ?? "")) throw new Error(`@mkbabb/glass-ui resolved from ${entry.resolved} — not the registry`);
                  for (const subpath of ["blob", "chip"]) {
                      console.log(`@mkbabb/glass-ui/${subpath} -> ${import.meta.resolve(`@mkbabb/glass-ui/${subpath}`)}`);
                  }
                  console.log(`@mkbabb/glass-ui ${entry.version} <- ${entry.resolved}`);
                  NODE
            # The demo self-aliases `@mkbabb/value.js` → dist/value.js
            # (vite.config.ts, mechanism-C), so the library dist must exist before
            # the gh-pages build resolves the graph.
            - name: Build value.js dist (the self-alias target)
              run: npm run build
            - name: Build demo SPA (gh-pages mode → dist/gh-pages)
              run: npm run gh-pages
            # Plain wrangler invocation (R.W7 X3): the wrangler-action's npx
            # under the nested workingDirectory refused to fetch wrangler
            # non-interactively ("no YES option"). `npx --yes` + native env
            # auth is the explicit, magic-free equivalent.
            - name: Deploy to Cloudflare Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              # The demo build output dir is dist/gh-pages (vite.config.ts
              # gh-pages mode outDir). `--commit-dirty=true` lets a clean CI
              # checkout deploy without a dirty-tree warning.
              #
              # --branch=master, NOT main: the CF Pages project `color`'s
              # PRODUCTION branch is `master` (verified via `wrangler pages
              # deployment list` 2026-07-07: the only Production deployment was
              # a2119a8d/16129e0, a month stale). Every `--branch=main` deploy
              # (incl. the R-close-era runs) landed as a PREVIEW deployment —
              # wrangler exits 0 and prints "Deployment complete", the run goes
              # green, but color-enw.pages.dev/color.babb.dev never update: a
              # FALSE-SUCCESS deploy. The branch flag must equal the project's
              # production branch for wrangler to cut a Production deployment.
              run: >-
                  npx --yes wrangler@4 pages deploy dist/gh-pages
                  --project-name=color
                  --branch=master
                  --commit-dirty=true
            # ── O-25 · PROD-LINEAGE ASSERT (T.W0 W0-6; SYNTHESIS §6.1 O-25;
            #    T.W0.md §Hard gate 6 — the buildable spec). The standing guard
            #    for the deploy-fully footgun: layer-5 (`80c5888`) proved a
            #    `--branch=main` deploy exits 0 + prints "Deployment complete"
            #    while cutting a PREVIEW deployment — color.babb.dev goes a month
            #    stale under a green run. This step makes the NEXT such window get
            #    caught by an oracle, not an owner eyeball: after the deploy, the
            #    CF Pages PRODUCTION deployment (Environment=Production,
            #    branch=master) must reference the BUILT commit.
            #
            #    CREDS PRECONDITION (named): CLOUDFLARE_API_TOKEN +
            #    CLOUDFLARE_ACCOUNT_ID. Absent creds ⇒ SKIPPED-WITH-RECORD (a loud
            #    notice), NEVER silently green (T.W0 §No-workaround).
            - name: "O-25 — assert prod lineage (CF Pages Production == built commit)"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  BUILT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
              run: |
                  set -uo pipefail
                  if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
                    echo "::notice title=O-25 SKIPPED::CF credentials absent (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) — prod-lineage assert SKIPPED-WITH-RECORD, never silently green. Wire the secrets to arm the guard."
                    exit 0
                  fi
                  SHORT="${BUILT_SHA:0:7}"
                  echo "O-25: built commit = ${BUILT_SHA} (short ${SHORT}); listing CF Pages deployments…"
                  LIST="$(npx --yes wrangler@4 pages deployment list --project-name=color 2>&1)" || {
                    echo "::error title=O-25::wrangler pages deployment list failed:"; echo "$LIST"; exit 1;
                  }
                  echo "$LIST"
                  if printf '%s\n' "$LIST" | grep -iE 'production' | grep -q "$SHORT"; then
                    echo "O-25 PASS: the Production deployment references the built commit ${SHORT}."
                  elif printf '%s\n' "$LIST" | grep -q "$SHORT"; then
                    echo "::warning title=O-25::built commit ${SHORT} is present in the deployment list but a Production-environment association could not be parsed from this wrangler output format — review the list above (not blocking a good deploy on a format quirk)."
                  else
                    echo "::error title=O-25 STALE-PROD::no CF Pages deployment references the built commit ${SHORT} — the deploy did not land as Production (the --branch footgun class). color.babb.dev is stale."
                    exit 1
                  fi
