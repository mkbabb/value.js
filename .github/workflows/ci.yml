name: ci

# The cheap gate (owner order 2026-11-13): install, lint, typecheck, the
# node/jsdom unit suite, build, and the static checks — one job, one install.
# No browser runs here. The Playwright projects, the three browser-backed unit
# files, boot-smoke, the visual oracle, the WebKit arm and Lighthouse run on the
# workstation before a ship: `npm run preship` (scripts/ci/preship.sh).
#
# deploy-pages.yml ships on this workflow's green master push.

on:
    push:
        branches:
            - "**"
        paths-ignore:
            - "docs/**"
            - "**/*.md"
    pull_request:
        paths-ignore:
            - "docs/**"
            - "**/*.md"

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: lint · typecheck · unit · build · api
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            # docs/ is ~4.5 GB of evidence nothing here reads, so the checkout is
            # sparse (no docs/) and blob-less. History stays (commits and trees
            # only): `test:css-equivalence` reads the retired parser and the
            # pinned demo sheets back from git, fetching those blobs on demand.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  filter: blob:none
                  sparse-checkout-cone-mode: false
                  sparse-checkout: |
                      /*
                      !/docs/
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      api/package-lock.json
            # `npm ci` runs `prepare`, which builds dist/ (the library build).
            - run: npm ci
            # The demo typecheck imports the api DTOs (mongodb types), and the
            # api suite runs below: install the api package once.
            - run: npm ci --prefix api
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run test:unit
            - run: npm run test:css-equivalence
            - run: node scripts/gen-grammar.mjs --check
            - name: pack and verify the published surface
              shell: bash
              run: |
                  FILE="$(node -p "const p=require('./package.json'); p.name.replace(/^@/,'').replace('/','-')+'-'+p.version+'.tgz'")"
                  npm pack --ignore-scripts > /dev/null
                  test -f "$FILE"
                  node scripts/ci/verify-packed-surface.mjs "$FILE"
            - name: api typecheck
              working-directory: api
              run: npx tsc --noEmit
            - name: api tests
              working-directory: api
              run: npm test
