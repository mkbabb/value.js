# domains.yml — colour.babb.dev, the second spelling (COHESION §0hq).
#
# Owner order 2026-11-04, verbatim: "color with no u, too, should be a domain. both."
# Ruled: both spellings resolve. color.babb.dev stays the one canonical origin and
# colour.babb.dev answers a path-preserving 301 to it. Not a second serving
# origin: identity is a slug session token in localStorage, which is per-origin,
# so a second origin would split the owner's palettes and session in two and
# would need a second API CORS origin.
#
# Mechanism: a Cloudflare Pages project `colour` whose only content is
# scripts/deploy/colour/ (a `_redirects` 301 to https://color.babb.dev/:splat).
# Its own *.pages.dev host 301s too, so no third serving origin appears. Nothing
# in the app, the API, the CSP, the `color` project or deploy-pages.yml changes.
# Not gated on CI: the payload is two static files with no build, and this job
# runs beside the CI -> deploy-pages chain without touching it.
#
# scripts/deploy/colour-domain.mjs does the API work, idempotently:
#   project   create `colour` if absent; hold its production branch at master
#   (deploy)  wrangler pages deploy --branch=master -> a Production deployment
#   domain    the pages.dev host 301s -> attach colour.babb.dev -> its proxied
#             CNAME (created if absent, never overwritten) -> wait for active ->
#             colour.babb.dev 301s with the path kept; color.babb.dev answers 200
# The weekly schedule runs the same job in `verify` mode: no deploy, no writes,
# red on any drift (the api-tls-smoke.yml precedent).
#
# SECRET DISCIPLINE: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (value.js's own
# pair, the one deploy-pages.yml uses) are step-level env only: never inlined
# into a run line, never echoed. The checkout keeps no git credential, so the
# npx-fetched wrangler cannot read one. The token is documented as Pages:Edit +
# Read; if it cannot write DNS on babb.dev the run goes red naming the one CNAME
# the owner adds (an OWNER ACT), and a re-dispatch then completes the domain.
name: domains

on:
    push:
        branches: [master]
        paths:
            - ".github/workflows/domains.yml"
            - "scripts/deploy/colour/**"
            - "scripts/deploy/colour-domain.mjs"
    workflow_dispatch: {}
    schedule:
        # Mondays 13:41 UTC (off the hour; apart from api-tls-smoke's 13:17).
        - cron: "41 13 * * 1"

# One provisioning run at a time, and a half-finished one is never cancelled.
concurrency:
    group: domains
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    colour:
        name: colour.babb.dev → 301 color.babb.dev
        # Production is provisioned from master only: a dispatch on another ref
        # would otherwise ship that ref's bytes as the Production deployment.
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            MODE: ${{ github.event_name == 'schedule' && 'verify' || 'provision' }}
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
            - name: "Pages project `colour` (create if absent · production branch master)"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: node scripts/deploy/colour-domain.mjs project "$MODE"
            # --branch=master equals the production branch the step above holds:
            # any other branch cuts a Preview and the host never updates (the
            # --branch footgun deploy-pages.yml records). The commit message stays
            # plain ASCII: wrangler 4 rejects an em-dash in it.
            - name: Deploy the 301 as Production
              if: github.event_name != 'schedule'
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: >-
                  npx --yes wrangler@4 pages deploy scripts/deploy/colour
                  --project-name=colour
                  --branch=master
                  --commit-hash="$GITHUB_SHA"
                  --commit-message="domains.yml colour 301 ${GITHUB_SHA::7}"
                  --commit-dirty=true
            - name: "colour.babb.dev: attach · DNS · active · verify the 301"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: node scripts/deploy/colour-domain.mjs domain "$MODE"
