<!doctype html>
<!-- The embed entry: one slice of the picker app for an allow-listed host
     (`/embed/#/picker?…`, `/embed/#/gradient?…`; ./bridge.ts). Its own document,
     so its response headers are its own (public/_headers `/embed/*`). -->
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <title>Colour</title>
        <!-- The host's scheme, stamped before first paint: `scheme` in the hash,
             else the platform's. `color-scheme` must equal the host's, or the
             browser backs a transparent frame with an opaque canvas. -->
        <script>
            (function () {
                var m = /[?&]scheme=(dark|light)\b/.exec(location.hash);
                var dark = m ? m[1] === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
                var e = document.documentElement;
                e.classList.toggle("dark", dark);
                e.style.colorScheme = dark ? "dark" : "light";
            })();
        </script>
        <link rel="preload" href="../fonts/fraunces-latin-normal.woff2" as="font" type="font/woff2" crossorigin />
        <style>
            @layer properties, theme, base, components, utilities;
            html, body { background: transparent; margin: 0; }
            @font-face {
                font-family: "Fraunces";
                font-style: normal;
                font-weight: 100 900;
                font-display: fallback;
                src: url(../fonts/fraunces-latin-normal.woff2) format("woff2");
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: "Fraunces";
                font-style: italic;
                font-weight: 100 900;
                font-display: fallback;
                src: url(../fonts/fraunces-latin-italic.woff2) format("woff2");
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: "Fraunces Fallback";
                src: local("Georgia");
                size-adjust: 89.26%;
                ascent-override: 109.79%;
                descent-override: 29.13%;
                line-gap-override: 0%;
            }
            @font-face {
                font-family: "Fraunces Fallback";
                font-style: italic;
                src: local("Georgia Italic"), local("Georgia-Italic");
                size-adjust: 97.09%;
                ascent-override: 100.94%;
                descent-override: 26.78%;
                line-gap-override: 0%;
            }
        </style>
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
