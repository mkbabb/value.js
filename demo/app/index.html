<!doctype html>
<!-- U.W-A11Y · U-F58 (BR-10) — RTL mechanical readiness. `dir="ltr"` is the
     explicit default-direction plumbing (was absent: `lang` present, `dir` not).
     The single-locale English tool does NOT do full string extraction (that half
     is out-of-scope, recorded in the U-F58 decision table); this establishes the
     `dir` seam so `dir="rtl"` flips the whole document and the grid/flex layout
     (style.css uses grid + flex + shorthand padding — no global physical
     left/right positioning) stays integral by construction. Per-component
     physical-property → logical conversions are BOOKED follow-ups
     (docs/tranches/U/audit/w-a11y/rtl-logical-property-audit.md). -->
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

        <title>Color Picker</title>
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

        <!-- W2-3 (T.W2 · LS-6): Fraunces SELF-HOSTED — the display voice is
             struck from the network timeline (the Google-Fonts actor RETIRES;
             zero cross-origin font requests). Variable woff2 (opsz 9..144,
             wght 100..900), latin + latin-ext, normal + italic, served from
             ./fonts/. The latin-normal face — the title/hero glyphs — is
             PRELOADED so it arrives with the critical resources.

             W4-2 (T.W4 · O-10c): the latin-normal face is the tnum-MINTED
             build (scripts/fonts/build-fraunces-tnum.py — no Fraunces
             artifact anywhere ships tabular figures; the mint cuts the .tf
             set the foundry never did: constant-advance composites + a real
             GSUB tnum feature). The readout's `font-variant-numeric:
             tabular-nums` is therefore LIVE, verified by rendered
             digit-advance (never by declaration — the F5 class). -->
        <!-- (original W2-3 note continues)

             THE BOUNDED INK GATE (D3 [AMENDED-AT-HARDENING M-12]):
             `font-display: fallback` — a ~100ms UA block period (inside the
             ≤300ms cap; ink opens on load-or-block-end), then the
             METRIC-COMPATIBLE fallback below commits; the eventual swap is
             reflow-free because "Fraunces Fallback" is size-adjust-tuned
             Georgia (measured against the real face: size-adjust 89.26%,
             ascent 109.79%, descent 29.13%) — never an UNTUNED fallback
             commit, never a swap-reflow. font-display:fallback's no-late-swap
             arm is a non-case for a preloaded same-origin face (recorded). -->
        <link rel="preload" href="./fonts/fraunces-latin-normal.woff2" as="font" type="font/woff2" crossorigin />
        <!-- X.W11.h19b (COHESION §0gl.6; C10-1): the latin ITALIC face is
             used above the fold (the picker title, ColorSpaceSelector's
             `font-display italic`), so it is preloaded beside the upright
             face; the size-adjust-tuned italic "Fraunces Fallback" below
             stays as its metric-compatible landing face. Only the latin
             italic subset is preloaded — the latin-ext faces stay on use. -->
        <link rel="preload" href="./fonts/fraunces-latin-italic.woff2" as="font" type="font/woff2" crossorigin />
        <style>
            @font-face {
                font-family: "Fraunces";
                font-style: normal;
                font-weight: 100 900;
                font-display: fallback;
                src: url(./fonts/fraunces-latin-normal.woff2) format("woff2");
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: "Fraunces";
                font-style: normal;
                font-weight: 100 900;
                font-display: fallback;
                src: url(./fonts/fraunces-latin-ext-normal.woff2) format("woff2");
                unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
            }
            @font-face {
                font-family: "Fraunces";
                font-style: italic;
                font-weight: 100 900;
                font-display: fallback;
                src: url(./fonts/fraunces-latin-italic.woff2) format("woff2");
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: "Fraunces";
                font-style: italic;
                font-weight: 100 900;
                font-display: fallback;
                src: url(./fonts/fraunces-latin-ext-italic.woff2) format("woff2");
                unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
            }
            /* The metric-compatible fallback (the ink-gate's landing face). */
            @font-face {
                font-family: "Fraunces Fallback";
                src: local("Georgia");
                size-adjust: 89.26%;
                ascent-override: 109.79%;
                descent-override: 29.13%;
                line-gap-override: 0%;
            }
            /* X.W11.p2 (COHESION §0ge.1(ii); ESC-W11h19-1 arm b) — the ITALIC
               landing face. The italic Fraunces face is not preloaded: it loads
               on first use, off the critical path. Until now its fallback was
               the upright face above, slanted by synthesis — 2.3 % wider than
               the real italic per glyph run, so the swap re-flowed the italic
               title (the space label widened 11 px in front of its chevron,
               C10-1). Georgia Italic, size-adjust-tuned against the real italic
               face at the title's own setting (42.568 px, wght 400, tracking
               -0.025em, optical sizing auto; real/Georgia-Italic advance ratio
               0.9709 over the space names), makes the swap reflow-free. The
               vertical overrides carry the face's own ascent/descent (1956 /
               510 of 2000, identical to the upright face) through this
               size-adjust, as the upright pair does through its own. */
            @font-face {
                font-family: "Fraunces Fallback";
                font-style: italic;
                src: local("Georgia Italic"), local("Georgia-Italic");
                size-adjust: 97.09%;
                ascent-override: 100.94%;
                descent-override: 26.78%;
                line-gap-override: 0%;
            }
        </style>

        <!-- W2-2 (T.W2): the per-stop ground properties, registered PRE-PAINT
             so the B0 ground can transition. Each is a `<color>` — registered
             <color> custom properties interpolate in OKLab (CSS Color 4), the
             chroma-honest path the F-12 ground transition rides. The
             initial-values are the LIGHT first-visit constants (the boot
             script below overwrites them — persisted record or the ACTIVE
             scheme's constant — before first paint; these literals only ever
             paint if the script itself fails). U-F23: they are SINGLE-SOURCED —
             the `__GROUND_LIGHT_n__` tokens are injected from boot/ground.ts's
             FIRST_VISIT_GROUND.light at build/serve time (vite
             `groundRecordInject` → `injectGroundTokens`), never hand-typed. -->
        <style>
            @property --saved-bg-0 { syntax: "<color>"; inherits: true; initial-value: __GROUND_LIGHT_0__; }
            @property --saved-bg-1 { syntax: "<color>"; inherits: true; initial-value: __GROUND_LIGHT_1__; }
            @property --saved-bg-2 { syntax: "<color>"; inherits: true; initial-value: __GROUND_LIGHT_2__; }
            @property --saved-bg-3 { syntax: "<color>"; inherits: true; initial-value: __GROUND_LIGHT_3__; }
            @property --saved-bg   { syntax: "<color>"; inherits: true; initial-value: __GROUND_LIGHT_0__; }
        </style>

        <!-- W2-3 theme-color B0 sub-clause: minted from the persisted ground's
             base stop by the boot script below, pre-paint; useAtmosphere's
             sink updates it beside the `--saved-bg` pick transition. The
             fallback base stop is single-sourced (U-F23 `__GROUND_LIGHT_0__`). -->
        <meta name="theme-color" content="__GROUND_LIGHT_0__" />

        <!-- Critical: prevent FOUC before Tailwind CSS loads.
             Without this, .hidden elements are visible during the
             CSS/JS race, causing both mobile+desktop panes to render
             simultaneously, expanding the viewport past 1024px and
             flipping media queries to desktop mode permanently.

             Uses @layer so that once Tailwind loads, its utilities
             (lg:flex, lg:block) take priority and override this.

             W2-2: the body ground is the FIXED gradient template over the
             registered per-stop properties (the same template as style.css's
             base rule — the producer paletteToCssGradient geometry). The
             ground is a complete material from the first paint (B0).

             X.W11.v1c: THE DOCUMENT'S CASCADE-LAYER ORDER IS STATED HERE,
             ONCE, in the earliest stylesheet of both modes. A layer's rank is
             fixed by its FIRST declaration, and `main.ts` imports App.vue
             (and so every SFC sheet) before foundation.css's Tailwind
             statement: since d386d18bc the WatercolorDot sheet's
             `@layer components` came first, ranking every glass control
             BELOW Tailwind's `base` reset (button radius 0, transparent
             background), so dock pills lost their stadium and hover plate.
             This is the order foundation.css declares, fouc-guard lowest. -->
        <style>
            @layer fouc-guard, properties, theme, base, components, utilities;
            @layer fouc-guard {
                .hidden { display: none; }
                body {
                    background-color: var(--saved-bg);
                    background-image: linear-gradient(
                        135deg,
                        var(--saved-bg-0) 0%,
                        var(--saved-bg-1) 33%,
                        var(--saved-bg-2) 67%,
                        var(--saved-bg-3) 100%
                    );
                }
            }
        </style>

        <!-- The fouc-guard boot script: scheme FIRST, then the ground.
             Order is the law (W2-2): resolve the ACTIVE scheme, then paint
             the persisted gradient ONLY on a scheme+version match — else the
             ACTIVE scheme's member of the first-visit constant PAIR (dark-
             honest by construction, F-6: a dark first run never boots as a
             light-pink page). The persisted shape is `{stops, scheme,
             deriveVersion}` — STOPS, never a gradient string; the read is
             shape-validated and falls to the constants on ANY malformation.
             U-F23 (G-CANON-4): the CONSTANTS (VERSION, the FIRST_VISIT seed,
             the stop count) are SINGLE-SOURCED — the `__GROUND_*__` tokens are
             injected from boot/ground.ts at build/serve time (vite
             `groundRecordInject` → `injectGroundTokens`), so a
             GROUND_RECORD_VERSION bump propagates here automatically and can no
             longer strand the boot. Only the guard LOGIC below is mirrored
             (inherent to a pre-module reader that cannot import).
             X.W11.h7b (COHESION §0gl.10 · O28-114): a `#/?color=` share link
             paints its SEEDED ground from the first frame. The derive is not
             mirrored: vite's `seededGroundInline` bundles the one source
             module (`boot/seeded-ground.ts`, which useAtmosphere's sink also
             runs). X.W11.p4b (§0gn.2(b)): only its `parseUrlSeed` is inline
             (`__vjsUrlSeed`); the derive is the same module built as a hashed
             classic script (`__vjsSeededGround`), written in below —
             parser-blocking, so it runs before the boot script — ONLY when the
             URL carries a seed. An unseeded document never fetches it. -->
        <script>
            __GROUND_URL_SEED__
            if (__vjsUrlSeed.parseUrlSeed(location.hash)) {
                document.write('<script src="__GROUND_SEEDED_DERIVE_SRC__"><\/script>');
            }
        </script>
        <script>
            (function() {
                // B0 — the ground beat (the overture's origin mark; O-4 reads it).
                if (window.performance && performance.mark) performance.mark('overture:b0');
                var s = document.documentElement.style;
                // Scheme resolution MIRRORS useColorMode (the producer's own
                // darkModeSyncScript semantics): the app persists "auto" by
                // default, so "auto" MUST honor prefers-dark — the T.W4.5 R1
                // cure (a returning dark-preference visit used to read "auto"
                // as light and boot the light material, re-theming mid-boot).
                var stored = localStorage.getItem('vueuse-color-scheme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var dark = stored === 'dark' || ((stored === 'auto' || !stored) && prefersDark);
                if (dark) document.documentElement.classList.add('dark');
                s.colorScheme = dark ? 'dark' : 'light';

                // The first-visit constant PAIR + the version + the stop count
                // are SINGLE-SOURCED from boot/ground.ts (U-F23): the
                // `__GROUND_*__` tokens are injected by vite's
                // `injectGroundTokens` at build/serve time, so a
                // GROUND_RECORD_VERSION bump propagates here and never strands
                // the boot. (dark = the producer derive's dark band — honest
                // for a dark first run.)
                var FIRST_VISIT = __GROUND_FIRST_VISIT__;
                var VERSION = __GROUND_RECORD_VERSION__;
                var scheme = dark ? 'dark' : 'light';
                var stops = FIRST_VISIT[scheme];
                // A share-link seed wins, in hydrate's order (URL, then the
                // record, then the constants): the same pure derive the app's
                // sink runs, over the same `parseUrlSeed` hydrate reads with.
                // The derive script is written in above exactly when the URL
                // carries a seed; a seed whose derive script did not load
                // (offline, a failed fetch) paints like a refused seed.
                var url = __vjsUrlSeed.parseUrlSeed(location.hash);
                var seeded = url && window.__vjsSeededGround &&
                    window.__vjsSeededGround.seededGroundStops(
                        url.color.trim().toLowerCase(), dark);
                if (seeded) stops = seeded;
                else try {
                    var rec = JSON.parse(localStorage.getItem('color-picker-ground'));
                    if (rec && rec.deriveVersion === VERSION &&
                        rec.scheme === scheme &&
                        Array.isArray(rec.stops) && rec.stops.length === __GROUND_STOP_COUNT__ &&
                        rec.stops.every(function (x) { return /^#[0-9a-fA-F]{6}$/.test(String(x)); })) {
                        stops = rec.stops;
                    }
                } catch (e) { /* malformed record → the constants */ }
                for (var i = 0; i < __GROUND_STOP_COUNT__; i++) {
                    s.setProperty('--saved-bg-' + i, stops[i]);
                }
                s.setProperty('--saved-bg', stops[0]);
                // theme-color rides the ground's base stop from B0.
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', stops[0]);

                // X.W11.p3 (COHESION §0ge.1(iii)) — the FIRST-VIEW decision. The
                // gh-pages build ships `/` prerendered at its default seed
                // (scripts/build/prerender-shell.ts). This visit shows and
                // hydrates that shell only when its first view IS that render:
                // the home route with no URL seed, no stored seed (the
                // `color-picker` record — COLOR_STORE_KEY, mirrored like the
                // ground keys above), and motion allowed (under reduced motion
                // the dock is first-paint state the shell does not carry).
                // Anything else stamps `client`: the rule below hides the shell
                // before paint and main.ts client-renders from an emptied root.
                var shell = false;
                try {
                    var hash = location.hash;
                    var seed = JSON.parse(localStorage.getItem('color-picker'));
                    shell = (hash === '' || hash === '#' || hash === '#/') &&
                        !(seed && typeof seed.inputColor === 'string' && seed.inputColor.trim()) &&
                        !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                } catch (e) { /* an unreadable record → the client render */ }
                document.documentElement.setAttribute('data-first-view', shell ? 'shell' : 'client');
            })();
        </script>
        <style>
            html:not([data-first-view="shell"]) #app[data-prerendered] {
                display: none;
            }
        </style>

        <script type="module" src="./main.ts"></script>
    </head>

    <!-- W6-8 (S.W6 · card-lighting forensics artifact 1): the body IS the
         atmosphere/field plane host — it paints the `--saved-bg` derived
         ground and contains the aurora canvas AND every teleported overlay.
         `data-paper-field` is glass-ui's field contract: under this ancestor,
         the producer's orphan-card warm field-floor fallback (cards.css
         presence-behind gate) switches OFF, so every glass card — portaled
         dialogs included — reads the REAL atmosphere through the glass instead
         of painting its own interior amber lamp. One attribute; no local glass
         recipe. -->
    <!-- X.W5.a · fold W5F-30 / ⟨App C-8 · L-2⟩ — the mount container is a
         `<div>` INSIDE the body, not the body itself. `app.mount` clears its
         container's innerHTML, so while the body WAS the container no static
         in-body markup could survive the mount: a boot-error region, a
         no-JS message, a skip target — all structurally impossible, not
         merely absent. BOTH body stamps stay exactly where they were, and the
         D-E portal-integrity delta is the receipt: `data-paper-field` must
         keep dominating the two live `<Teleport to="body">` sites, and
         `class="relative"` stays the positioning ancestor portalled overlays
         resolve against (its load-bearing status is unproven either way, and
         no gate asks for its deletion — so it is not deleted). -->
    <body class="relative" data-paper-field>
        <!-- X.W11.p4d L1 (COHESION §0gs.4): on the shell path the module graph
             starts after first paint. The gh-pages build moves the entry
             `<script type="module">` and its modulepreloads, unchanged, into
             the inert `<template id="vjs-after-paint">` that ends the head
             (scripts/build/prerender-shell.ts), so the first paint's fetch set
             is the document, its render-blocking sheet and the fonts. This is
             the decision, read from the head's first-view stamp:
             - `client`: the tags are written here, parser-inserted, so the
               entry keeps a static module script's deferred timing.
             - `shell`: the painted shell needs no script to be contentful, so
               the tags go in after the document is parsed and one frame has
               painted (rAF, then a task). A hidden document paints nothing,
               so it starts at once.
             The dev server serves the static entry and no template. -->
        <script>
            (function () {
                var graph = document.getElementById("vjs-after-paint");
                if (!graph) return;
                if (document.documentElement.getAttribute("data-first-view") !== "shell") {
                    document.write(graph.innerHTML);
                    return;
                }
                function start() {
                    var tags = graph.content.children;
                    for (var i = 0; i < tags.length; i++) {
                        var el = document.createElement(tags[i].localName);
                        for (var a = 0; a < tags[i].attributes.length; a++) {
                            el.setAttribute(tags[i].attributes[a].name, tags[i].attributes[a].value);
                        }
                        document.head.appendChild(el);
                    }
                }
                function afterPaint() {
                    if (document.visibilityState === "hidden") start();
                    else requestAnimationFrame(function () { setTimeout(start, 0); });
                }
                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", afterPaint, { once: true });
                } else afterPaint();
            })();
        </script>
        <!-- X-W12 Repair 1 (H-1): the ground's 200ms material clock runs on
             this descendant-less fixed plate, never on :root (foundation.css
             `.ground-breath`). -->
        <div class="ground-breath" aria-hidden="true"></div>
        <div id="app"></div>
        <!-- X.W11.v1c: a document that serves NO shell is a client first view.
             The head's fouc-guard stamp reads only the visit (route, seed,
             motion), because the root is not parsed yet; on the dev server,
             which serves no shell (main.ts), it stamped `shell` on every cold
             `/`, so App.vue's HYDRATES_SHELL routed the inspector through the
             idle-hydration wrapper that waits for the pane chunk, and the
             region painted nothing — no loading plate — while About's chunk
             was in flight (cold-nav-scene-enter `/#/` RED from b5df0da12,
             bisected). This classic script runs before any module script,
             with the root parsed: no `data-prerendered` root, no shell. -->
        <script>
            if (!document.getElementById("app").hasAttribute("data-prerendered"))
                document.documentElement.setAttribute("data-first-view", "client");
        </script>
    </body>
</html>
